name: Demo - real-world vulnerability scan
on:
  push:
    branches: [demo/real-world-scan]
    paths: [".github/workflows/demo-real-world-scan.yml", "demo/*.json", "demo/*.yaml"]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt
      - name: Scan the shop SBOM (live OSV, NVD, EPSS, CISA KEV, GitHub Advisories)
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -o pipefail
          mkdir -p demo/results
          { echo '$ python scripts/vuln_intel.py scan demo/shop-sbom.json --context demo/shop-context.yaml --format markdown'; \
            python scripts/vuln_intel.py scan demo/shop-sbom.json --context demo/shop-context.yaml --format markdown; } 2>&1 | tee demo/results/scan.md
          python scripts/vuln_intel.py scan demo/shop-sbom.json --context demo/shop-context.yaml --format json --output demo/results/scan.json
          { echo '$ python scripts/vuln_intel.py enrich CVE-2021-44228 --context demo/shop-context.yaml'; \
            python scripts/vuln_intel.py enrich CVE-2021-44228 --context demo/shop-context.yaml; } 2>&1 | tee demo/results/enrich-log4shell.txt
      - name: Save results to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add demo/results && git commit -m "Demo scan results" && git push
